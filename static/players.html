<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Find players across the group's games."><title>Players · mimELo</title><link rel="stylesheet" href="/base.css"><script src="/common.js"></script><script>themeLink('home')</script></head>
<body class="home-page"><a class="skip-link" href="#main">Skip to content</a><main id="main" class="directory-main">
<header class="site-header"><div class="header-inner"><a class="brand" href="/" aria-label="mimELo home"><span class="crest-plate" id="logo"></span><span><span class="brand-word">mim<span>ELo</span></span><span class="brand-sub">The group record book</span></span></a><nav id="nav" aria-label="Primary navigation"></nav><div class="header-actions"><a class="btn btn-outline" href="/">All games</a></div></div></header>
<section class="directory-hero"><div class="directory-hero-inner"><div><p class="eyebrow">Across all five record books</p><h1>Players</h1><p class="sub">Find a username and see which games they play.</p></div><div class="directory-count"><b id="player-count">0</b><span>players</span></div></div></section>
<section class="directory-content"><div class="directory-toolbar"><label for="q">Search by name or username</label><input type="search" id="q" placeholder="Start typing…" autocomplete="off"></div><div class="directory-grid" id="list" aria-live="polite"></div><p class="empty" id="empty" hidden>No players match that search.</p></section><footer class="site-footer"><span>mimELo · A shared record book for the group</span><span>Players across every game</span></footer></main>
<script>
let all=[];const draw=()=>{const q=$('#q').value.trim().toLowerCase();const f=all.filter(p=>(p.name+' '+(p.username||'')+' '+p.games.map(g=>g.title).join(' ')).toLowerCase().includes(q));
 $('#player-count').textContent=all.length;$('#list').innerHTML=f.map(p=>`<article class="directory-player"><a class="directory-person" href="/player.html?id=${p.id}"><img class="directory-avatar" src="/assets/brand/profile-placeholder.svg" width="64" height="64" alt=""><span><strong>${esc(p.name)}</strong><small>${p.username?'@'+esc(p.username):'Profile not claimed yet'}</small></span><span class="directory-arrow" aria-hidden="true">→</span></a><div class="directory-games"><span class="directory-label">Games with records</span><div class="directory-game-list">${p.games.length?p.games.map(g=>`<a href="/player.html?id=${p.id}&g=${encodeURIComponent(g.slug)}" class="directory-game-chip"><span class="game-dot" data-game="${esc(g.slug)}" aria-hidden="true"></span>${esc(g.title)}</a>`).join(''):'<span class="directory-meta">No match history yet</span>'}</div></div></article>`).join('');$('#empty').hidden=!!f.length};
boot('home').then(async()=>{const [people,games]=await Promise.all([api('players'),api('games')]);const memberships=await Promise.all(games.map(async g=>[g.slug,await api(`games/${encodeURIComponent(g.slug)}/players`)]));const byPlayer=new Map(people.map(p=>[p.id,{...p,games:[]} ]));memberships.forEach(([slug,players])=>{const game=games.find(g=>g.slug===slug);players.forEach(p=>byPlayer.get(p.id)?.games.push({slug,title:game.title}))});all=[...byPlayer.values()];draw()}).catch(()=>{$('#empty').hidden=false;$('#empty').textContent='Players could not be loaded right now.'});$('#q').oninput=draw;
</script></body></html>
